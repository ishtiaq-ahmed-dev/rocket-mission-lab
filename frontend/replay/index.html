<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LZ-1 Booster Flight Replay</title>
<style>
:root{--cy:#7fe3ff;--am:#ffb347;--bg:rgba(8,12,18,.72);--ln:rgba(127,227,255,.22);--tx:#d8e6ee;--dim:#7d93a0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--tx);font:12px/1.3 ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace;user-select:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
.panel{background:var(--bg);border:1px solid var(--ln);border-radius:6px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#title{position:fixed;left:14px;top:12px;font-size:11px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
#title b{color:var(--cy);font-weight:600}
#camlabel{position:fixed;left:14px;top:30px;font-size:11px;color:var(--am);letter-spacing:.12em}
#hud{position:fixed;right:12px;top:12px;width:262px;padding:10px 12px 12px}
#hud .hd{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.2em;color:var(--dim);margin-bottom:6px}
#hud .hd i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3dff9a;margin-right:6px;box-shadow:0 0 8px #3dff9a}
#clock{color:var(--cy);font-size:13px;letter-spacing:.06em}
#phase{font-size:13px;font-weight:700;color:var(--am);letter-spacing:.1em;padding:6px 0 7px;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);margin-bottom:7px;min-height:30px}
#hud .r{display:flex;justify-content:space-between;align-items:baseline;padding:2.5px 0}
#hud .r span{color:var(--dim);font-size:10px;letter-spacing:.14em}
#hud .r b{font-size:14px;font-weight:600;color:#eaf6ff;font-variant-numeric:tabular-nums}
#hud .r b u{text-decoration:none;font-size:10px;color:var(--dim);margin-left:4px;font-weight:400}
.bar{height:3px;background:rgba(255,255,255,.08);border-radius:2px;margin:1px 0 5px;overflow:hidden}
.bar div{height:100%;width:0;background:linear-gradient(90deg,#3aa8ff,#ffe9b0);transition:width .08s}
#pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
#pills em{font-style:normal;font-size:9px;letter-spacing:.08em;padding:2px 5px;border:1px solid var(--ln);border-radius:3px;color:var(--dim)}
#pills em.on{color:#06121a;background:var(--cy);border-color:var(--cy)}
#pills em.done{color:var(--tx);border-color:rgba(127,227,255,.5)}
#bottom{position:fixed;left:12px;right:12px;bottom:12px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#bottom>*{pointer-events:auto}
#cams{display:flex;gap:4px;padding:5px}
#cams button{background:transparent;border:1px solid transparent;color:var(--tx);font:inherit;padding:6px 10px;border-radius:4px;cursor:pointer;display:flex;gap:7px;align-items:center;white-space:nowrap}
#cams button kbd{font:inherit;font-size:10px;color:var(--cy);border:1px solid var(--ln);border-radius:3px;padding:0 5px}
#cams button:hover{background:rgba(127,227,255,.1)}
#cams button.on{background:rgba(127,227,255,.16);border-color:rgba(127,227,255,.55)}
#play{width:100%;max-width:1100px;display:flex;align-items:center;gap:12px;padding:8px 12px}
#play button{background:transparent;border:1px solid var(--ln);color:var(--tx);font:inherit;border-radius:4px;padding:5px 9px;cursor:pointer}
#play button:hover{background:rgba(127,227,255,.12)}
#play button.on{background:var(--cy);color:#06121a;border-color:var(--cy)}
#pp{width:38px;font-size:13px}
#spd{display:flex;gap:4px}
#tl{position:relative;flex:1;height:30px}
#scrub{position:absolute;left:0;right:0;top:2px;width:100%;height:16px;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
#scrub::-webkit-slider-runnable-track{height:4px;background:rgba(255,255,255,.14);border-radius:2px}
#scrub::-moz-range-track{height:4px;background:rgba(255,255,255,.14);border-radius:2px}
#scrub::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:16px;margin-top:-6px;background:var(--cy);border-radius:2px;box-shadow:0 0 10px rgba(127,227,255,.7)}
#scrub::-moz-range-thumb{width:12px;height:16px;background:var(--cy);border:0;border-radius:2px}
#ticks{position:absolute;left:6px;right:6px;top:18px;height:12px;pointer-events:none}
#ticks i{position:absolute;top:0;font-style:normal;font-size:9px;color:var(--dim);transform:translateX(-50%);white-space:nowrap}
#ticks i:before{content:"";position:absolute;left:50%;top:-5px;width:1px;height:4px;background:var(--dim)}
#tnow{width:132px;text-align:right;color:var(--cy);font-variant-numeric:tabular-nums}
#hint{position:fixed;left:14px;bottom:112px;font-size:10px;color:var(--dim);letter-spacing:.06em;line-height:1.6;pointer-events:none}
#ob{position:fixed;inset:0;pointer-events:none;display:none;box-shadow:inset 0 0 160px rgba(0,0,0,.65)}
#ob:before,#ob:after{content:"";position:absolute;width:34px;height:34px;border:2px solid rgba(127,227,255,.6)}
#ob:before{left:24px;top:60px;border-right:0;border-bottom:0}
#ob:after{right:24px;bottom:150px;border-left:0;border-top:0}
#ob span{position:absolute;left:66px;top:62px;color:#ff5a5a;font-size:11px;letter-spacing:.2em}
#ob span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3b3b;margin-right:8px;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.15}}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:#ffb0b0;font-size:14px;padding:30px;background:#06090d}
@media(max-width:820px){#hud{width:210px;font-size:11px}#hud .r b{font-size:12px}#cams button span{display:none}#hint{display:none}#tnow{width:100px}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="ob"><span>SKIRT CAM</span></div>
<div id="title"><b>LZ-1</b> &middot; booster flight replay</div>
<div id="camlabel"></div>
<div id="hud" class="panel">
  <div class="hd"><div><i></i>TELEMETRY</div><div id="clock">T+00.0</div></div>
  <div id="phase">LIFTOFF</div>
  <div class="r"><span>ALT AGL</span><b><em id="alt" style="font-style:normal">0</em><u id="altu">m</u></b></div>
  <div class="r"><span>V VERT</span><b><em id="vv" style="font-style:normal">0</em><u>m/s</u></b></div>
  <div class="r"><span>V HORIZ</span><b><em id="vh" style="font-style:normal">0</em><u>m/s</u></b></div>
  <div class="r"><span>MACH</span><b><em id="mach" style="font-style:normal">0.00</em></b></div>
  <div class="r"><span>PITCH / TILT</span><b><em id="pitch" style="font-style:normal">90.0</em><u>/</u><em id="tilt" style="font-style:normal">0.0</em><u>&deg;</u></b></div>
  <div class="r"><span>DYN Q</span><b><em id="q" style="font-style:normal">0.0</em><u>kPa</u></b></div>
  <div class="r"><span>THROTTLE</span><b><em id="thr" style="font-style:normal">0</em><u>%</u></b></div>
  <div class="bar"><div id="thrb"></div></div>
  <div class="r"><span>PROP MASS</span><b><em id="prop" style="font-style:normal">0</em><u>kg</u></b></div>
  <div class="bar"><div id="propb"></div></div>
  <div id="pills"></div>
</div>
<div id="hint">1-6 camera &nbsp; SPACE play/pause &nbsp; &larr; &rarr; seek &nbsp; R restart &nbsp; H hide HUD</div>
<div id="bottom">
  <div id="cams" class="panel">
    <button data-cam="1"><kbd>1</kbd><span>Rocket Orbit</span></button>
    <button data-cam="2"><kbd>2</kbd><span>Chase Cam</span></button>
    <button data-cam="3"><kbd>3</kbd><span>Launch Tower</span></button>
    <button data-cam="4"><kbd>4</kbd><span>Skirt Cam</span></button>
    <button data-cam="5"><kbd>5</kbd><span>Landing Pad</span></button>
    <button data-cam="6"><kbd>6</kbd><span>Overview</span></button>
  </div>
  <div id="play" class="panel">
    <button id="pp" title="Play / pause (Space)">&#10074;&#10074;</button>
    <div id="spd"><button data-s="0.5">0.5x</button><button data-s="1" class="on">1x</button><button data-s="2">2x</button></div>
    <div id="tl"><input id="scrub" type="range" min="0" max="90" step="0.01" value="0"><div id="ticks"></div></div>
    <div id="tnow">T+00.00 / 90.00</div>
  </div>
</div>
<div id="msg"></div>

<script>
'use strict';
function loadScript(urls){
  return new Promise(function(res,rej){
    var i=0;
    (function next(){
      if(i>=urls.length)return rej(new Error('load failed: '+urls[0]));
      var s=document.createElement('script');s.src=urls[i++];
      s.onload=res;s.onerror=function(){s.remove();next();};
      document.head.appendChild(s);
    })();
  });
}
loadScript(['https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js','https://unpkg.com/three@0.147.0/build/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r147/three.min.js'])
.then(function(){return loadScript(['https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js','https://unpkg.com/three@0.147.0/examples/js/controls/OrbitControls.js']);})
.then(function(){start();})
.catch(function(e){var m=document.getElementById('msg');m.style.display='flex';m.textContent='Could not load Three.js from the CDN. Check your connection and reload. ('+e.message+')';});

function start(){
const THREE_=THREE;
/* ---------- utilities ---------- */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
const V3=THREE.Vector3;
const DEG=Math.PI/180;
/* periodic value noise (tileable) */
const NZ=(function(){
  const G=256,grid=new Float32Array(G*G),r=mulberry32(1337);
  for(let i=0;i<grid.length;i++)grid[i]=r();
  function pn(x,y,P){
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const x0=((xi%P)+P)%P,x1=(x0+1)%P,y0=((yi%P)+P)%P,y1=(y0+1)%P;
    const a=grid[y0*G+x0],b=grid[y0*G+x1],c=grid[y1*G+x0],d=grid[y1*G+x1];
    return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
  }
  function fbm(u,v,P,o){let s=0,a=.5,n=0;for(let i=0;i<o;i++){s+=a*pn(u*P,v*P,P);n+=a;P*=2;a*=.5;}return s/n;}
  return {pn,fbm};
})();

/* ---------- standard atmosphere ---------- */
function isa(h){
  h=Math.max(0,h);
  let T,rho,pr;
  if(h<11000){T=288.15-0.0065*h;const k=T/288.15;rho=1.225*Math.pow(k,4.256);pr=Math.pow(k,5.256);}
  else{T=216.65;const e=Math.exp(-(h-11000)/6341.6);rho=0.3639*e;pr=0.2234*e;}
  return {T,rho,pr,a:Math.sqrt(1.4*287.05*T)};
}

/* ---------- scripted flight corridor ---------- */
const T_END=90,T_APO=38,T_MECO=29,T_IGN=59.6,T_LEGS=79.0,T_TD=85,APOGEE=15000,MOUNT_H=2.5,PAD_Y=0.25;
const LAUNCH=new V3(0,0,0),LZ=new V3(1650,0,-430);
const DIRH=new V3().subVectors(LZ,LAUNCH).setY(0);const RANGE=DIRH.length();DIRH.normalize();
const SIDE=new V3(-DIRH.z,0,DIRH.x);
const PHASES=[
  {t:0,n:'LIFTOFF / ROLL PROGRAM',s:'LIFTOFF'},
  {t:25,n:'SUPERSONIC CLIMB / APOGEE',s:'CLIMB'},
  {t:45,n:'RE-ENTRY / GRID FIN GUIDANCE',s:'RE-ENTRY'},
  {t:60,n:'POWERED LANDING BURN',s:'LAND BURN'},
  {t:80,n:'LEG DEPLOY / TERMINAL DESCENT',s:'LEGS'},
  {t:85,n:'TOUCHDOWN / ENGINE CUTOFF',s:'TOUCHDOWN'}
];
function keyInterp(K,t){
  const n=K.length;
  if(t<=K[0][0])return K[0][1];
  if(t>=K[n-1][0])return K[n-1][1];
  let i=0;while(i<n-2&&t>K[i+1][0])i++;
  const t0=K[i][0],t1=K[i+1][0],y0=K[i][1],y1=K[i+1][1],h=t1-t0;
  const m0=i>0?(y1-K[i-1][1])/(t1-K[i-1][0]):(y1-y0)/h;
  const m1=i<n-2?(K[i+2][1]-y0)/(K[i+2][0]-t0):(y1-y0)/h;
  const s=(t-t0)/h,s2=s*s,s3=s2*s;
  return (2*s3-3*s2+1)*y0+(s3-2*s2+s)*h*m0+(-2*s3+3*s2)*y1+(s3-s2)*h*m1;
}
const TILT_K=[[0,0],[5,0],[12,2.5],[22,6.5],[30,8.5],[36,8],[38.5,3],[41,-9],[44,-16],[47,-20],[51,-17],[55,-11],[59.5,-7],[62,-5.5],[66,-3.8],[72,-2.3],[78,-0.9],[82,0],[90,0]];
const ROLL_K=[[0,0],[2.5,0],[14,92],[25,96],[38,96],[46,101],[52,93],[60,95],[80,90],[90,90]];

const FL=(function(){
  const dt=0.01,N=Math.round(T_END/dt)+1;
  const A=new Float64Array(N),V=new Float64Array(N),X=new Float64Array(N),P=new Float64Array(N);
  const sst=u=>{u=clamp(u,0,1);return u*u*(3-2*u);};
  const iApo=Math.round(T_APO/dt),i60=Math.round(60/dt),i85=Math.round(T_TD/dt);
  function vLand(t){
    if(t<=80){const u=(t-60)/20;return -(6+244*(1-sst(u)));}
    if(t<=85){const w=(t-80)/5;return -(0.8+5.2*(1-sst(w)));}
    return 0;
  }
  A[i85]=0;V[i85]=-0.8;
  for(let i=i85-1;i>=i60;i--){V[i]=vLand(i*dt);A[i]=A[i+1]-0.5*(V[i]+V[i+1])*dt;}
  const tp=T_APO+0.55*(60-T_APO);
  function vDesc(t,Vp){return t<=tp?-Vp*sst((t-T_APO)/(tp-T_APO)):-(250+(Vp-250)*(1-sst((t-tp)/(60-tp))));}
  function drop(Vp){let a=APOGEE;for(let i=iApo;i<i60;i++)a+=0.5*(vDesc(i*dt,Vp)+vDesc((i+1)*dt,Vp))*dt;return a;}
  let lo=260,hi=4000;
  for(let k=0;k<60;k++){const m=(lo+hi)/2;if(drop(m)>A[i60])lo=m;else hi=m;}
  const Vp=(lo+hi)/2;
  A[iApo]=APOGEE;V[iApo]=0;
  for(let i=iApo;i<i60;i++){V[i]=vDesc(i*dt,Vp);V[i+1]=vDesc((i+1)*dt,Vp);A[i+1]=A[i]+0.5*(V[i]+V[i+1])*dt;}
  A[i60]=A[i60];
  const q=1.3;
  const shape=t=>{const s=Math.pow(t/T_APO,q);const z=Math.sin(Math.PI*s);return z*z;};
  let I=0;for(let i=0;i<iApo;i++)I+=0.5*(shape(i*dt)+shape((i+1)*dt))*dt;
  const Va=(APOGEE-MOUNT_H)/I;
  A[0]=MOUNT_H;V[0]=0;
  for(let i=0;i<iApo;i++){V[i+1]=Va*shape((i+1)*dt);A[i+1]=A[i]+0.5*(V[i]+V[i+1])*dt;}
  for(let i=i85+1;i<N;i++){A[i]=0;V[i]=0;}
  /* horizontal progress */
  const B=t=>sst(t/25)*(1-sst((t-58)/24));
  let IB=0;for(let i=0;i<N-1;i++)IB+=0.5*(B(i*dt)+B((i+1)*dt))*dt;
  X[0]=0;for(let i=0;i<N-1;i++)X[i+1]=X[i]+0.5*(B(i*dt)+B((i+1)*dt))*dt*RANGE/IB;
  /* engine schedule */
  function eng(t){
    if(t<T_MECO+0.7){
      let th=Math.min(1,0.35+0.65*sst(t/1.3));
      th*=1-0.34*Math.exp(-Math.pow((t-17)/3.3,2));
      th*=1-0.28*sst((t-25.5)/3.2);
      if(t>T_MECO)th*=Math.exp(-(t-T_MECO)/0.12);
      return {thr:th,n:9};
    }
    if(t>=T_IGN&&t<T_TD+0.6){
      const i=Math.min(N-2,Math.round(t/dt));
      const aN=(V[i+1]-V[i])/dt;
      let th=clamp((aN+9.81)/29.5,0.4,1);
      th*=sst((t-T_IGN)/0.6);
      if(t>T_TD)th*=Math.exp(-(t-T_TD)/0.1);
      return {thr:th,n:t<72?3:1};
    }
    return {thr:0,n:0};
  }
  const cons=new Float64Array(N);
  for(let i=0;i<N-1;i++){const e=eng(i*dt);cons[i+1]=cons[i]+300*e.n*e.thr*dt;}
  const total=cons[N-1];
  const sample=new Float64Array(0);
  const tmpv=new V3();
  function state(t,o){
    t=clamp(t,0,T_END);
    const f=t/dt,i=Math.min(N-2,Math.floor(f)),u=f-i;
    const alt=A[i]*(1-u)+A[i+1]*u;
    const vv=V[i]*(1-u)+V[i+1]*u;
    const x=X[i]*(1-u)+X[i+1]*u;
    const vx=(X[i+1]-X[i])/dt;
    const fr=x/RANGE;
    const lat=90*Math.sin(Math.PI*fr);
    const dlat=90*Math.PI*Math.cos(Math.PI*fr)*vx/RANGE;
    const sink=t>T_TD?0.14*(1-Math.exp(-30*(t-T_TD)))*Math.exp(-3.5*(t-T_TD)):0;
    o.t=t;o.alt=alt;o.sink=sink;
    o.pos.set(LAUNCH.x+DIRH.x*x+SIDE.x*lat,PAD_Y+alt-sink,LAUNCH.z+DIRH.z*x+SIDE.z*lat);
    o.vel.set(DIRH.x*vx+SIDE.x*dlat,vv,DIRH.z*vx+SIDE.z*dlat);
    o.vv=vv;o.vh=Math.hypot(vx,dlat);o.speed=o.vel.length();
    const at=isa(alt);
    o.mach=o.speed/at.a;o.q=0.5*at.rho*o.speed*o.speed;o.pr=at.pr;
    o.tilt=keyInterp(TILT_K,t);o.roll=keyInterp(ROLL_K,t);
    const e=eng(t);o.thr=e.thr;o.nAct=e.thr>0.004?e.n:0;
    o.prop=2400+(total-(cons[i]*(1-u)+cons[i+1]*u));
    o.finDeploy=sstep(36.5,38.6,t);
    const amp=sstep(38.5,41,t)*(t<60?14:t<80?7:4)*(1-0.5*sstep(80,85,t));
    for(let k=0;k<4;k++){o.fin[k]=amp*(0.7*Math.sin(1.4*t+k*1.9)+0.3*Math.sin(3.7*t+k*0.7));}
    o.legs=sstep(T_LEGS,T_LEGS+3.6,t);
    const g=Math.min(1,o.nAct)*(t>T_IGN?1.8:1);
    o.gx=g*(1.6*Math.sin(0.9*t)+0.6*Math.sin(3.1*t));
    o.gz=g*(1.2*Math.cos(0.7*t)+0.5*Math.sin(2.7*t));
    o.heat=sstep(44,50,t)*(1-sstep(56,62,t))*clamp(o.q/30000,0,1.4);
    let ph=0;for(let k=0;k<PHASES.length;k++)if(t>=PHASES[k].t)ph=k;
    o.phase=ph;
    return o;
  }
  function mk(){return {pos:new V3(),vel:new V3(),fin:[0,0,0,0]};}
  return {state,mk,eng,Vp,tp};
})();
const ST=FL.mk();

/* ================= renderer / scene ================= */
const stage=document.getElementById('stage');
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});}
catch(e){const m=document.getElementById('msg');m.style.display='flex';m.textContent='WebGL is not available in this browser.';return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const maxAniso=Math.min(8,renderer.capabilities.getMaxAnisotropy());

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,window.innerWidth/window.innerHeight,0.5,200000);
camera.position.set(60,30,90);
scene.add(camera);
const FRAME=[];            /* per-frame hooks: fn(S,dt,tReal) */

/* ================= atmosphere (single-scatter, Rayleigh + Mie) ================= */
const ATM_COMMON=`
#define PI 3.14159265359
const float RE=6371000.0, HA=100000.0, HR=8000.0, HM=1200.0;
const vec3 bR=vec3(5.8e-6,13.5e-6,33.1e-6);
const float bM=21e-6;
const float SUNI=22.0;
vec2 atm_rs(float h0,float cy,float Rh){
  float b=(RE+h0)*cy;
  float c=(h0-Rh)*(2.0*RE+h0+Rh);
  float d=b*b-c;
  if(d<0.0) return vec2(1e12,-1e12);
  d=sqrt(d);
  return vec2(-b-d,-b+d);
}
float hash12(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
float hash13(vec3 p3){p3=fract(p3*.1031);p3+=dot(p3,p3.zyx+31.32);return fract((p3.x+p3.y)*p3.z);}
`;
function atmosFn(name,NS,NL){return `
vec3 ${name}(float h0,vec3 rd,float maxD,vec3 sd,out vec3 tr){
  vec2 ta=atm_rs(h0,rd.y,HA);
  vec2 tg=atm_rs(h0,rd.y,0.0);
  float t0=max(ta.x,0.0), t1=ta.y;
  if(tg.x>0.0 && tg.x<t1) t1=tg.x;
  t1=min(t1,maxD);
  float L=max(t1-t0,0.0);
  vec3 sR=vec3(0.0), sM=vec3(0.0);
  float odR=0.0, odM=0.0;
  for(int i=0;i<${NS};i++){
    float u0=float(i)/float(${NS}), u1=float(i+1)/float(${NS});
    float a=u0*u0, b=u1*u1;
    float tm=t0+L*0.5*(a+b);
    float ds=L*(b-a);
    vec3 p=vec3(0.0,RE+h0,0.0)+rd*tm;
    float hp=length(p)-RE;
    float dR=exp(-hp/HR)*ds, dM=exp(-hp/HM)*ds;
    odR+=dR; odM+=dM;
    vec3 up=p/(RE+hp);
    vec2 tl=atm_rs(hp,dot(up,sd),HA);
    float dl=tl.y/float(${NL});
    float lR=0.0,lM=0.0;
    for(int j=0;j<${NL};j++){
      vec3 q=p+sd*(dl*(float(j)+0.5));
      float hq=length(q)-RE;
      lR+=exp(-hq/HR)*dl; lM+=exp(-hq/HM)*dl;
    }
    vec3 at=exp(-(bR*(odR+lR)+vec3(bM*1.1)*(odM+lM)));
    sR+=at*dR; sM+=at*dM;
  }
  float mu=dot(rd,sd);
  float phR=3.0/(16.0*PI)*(1.0+mu*mu);
  float g=0.76;
  float phM=3.0/(8.0*PI)*((1.0-g*g)*(1.0+mu*mu))/((2.0+g*g)*pow(1.0+g*g-2.0*g*mu,1.5));
  tr=exp(-(bR*odR+vec3(bM*1.1*odM)));
  return SUNI*(sR*bR*phR+sM*bM*phM);
}`;}
const ATM_SKY=ATM_COMMON+atmosFn('atmosSky',12,4);

/* ---------- sky dome + stars + sun disc ---------- */
/* exaggerate altitude a little so the thin-air look of a ~30 km vantage is reached by the 15 km apogee */
function effAlt(a){a=Math.max(a,0);return a*(1+sstep(2000,14000,a));}
const skyUniforms={uSun:{value:SUN.clone()},uCamH:{value:50},uTime:{value:0},uDisc:{value:1},uMaxL:{value:1e4}};
const skyMat=new THREE.ShaderMaterial({
  uniforms:skyUniforms,side:THREE.BackSide,depthWrite:false,depthTest:true,fog:false,
  vertexShader:`varying vec3 vDir;
  void main(){vDir=position;vec4 p=modelViewMatrix*vec4(position,1.0);gl_Position=projectionMatrix*p;gl_Position.z=gl_Position.w*0.99999;}`,
  fragmentShader:ATM_SKY+`
  uniform vec3 uSun; uniform float uCamH; uniform float uTime; uniform float uDisc; uniform float uMaxL;
  varying vec3 vDir;
  float starLayer(vec3 d,float sc,float thr){
    vec3 p=d*sc; vec3 i=floor(p); vec3 f=fract(p);
    float h=hash13(i); if(h<thr) return 0.0;
    vec3 c=vec3(hash13(i+13.1),hash13(i+27.7),hash13(i+41.3))*0.6+0.2;
    float dd=length(f-c);
    float m=(h-thr)/(1.0-thr);
    return smoothstep(0.075,0.0,dd)*(0.35+m*m*2.4);
  }
  float vn(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
    return mix(mix(mix(hash13(i),hash13(i+vec3(1,0,0)),f.x),mix(hash13(i+vec3(0,1,0)),hash13(i+vec3(1,1,0)),f.x),f.y),
               mix(mix(hash13(i+vec3(0,0,1)),hash13(i+vec3(1,0,1)),f.x),mix(hash13(i+vec3(0,1,1)),hash13(i+vec3(1,1,1)),f.x),f.y),f.z);}
  void main(){
    vec3 rd=normalize(vDir);
    float h0=max(uCamH,2.0);
    vec3 tr;
    vec3 col=atmosSky(h0,rd,1e9,uSun,tr);
    float mu=dot(rd,uSun);
    /* ground seen beyond the finite ocean disc */
    if(atm_rs(h0,rd.y,0.0).x>0.0){ col+=tr*vec3(0.05,0.09,0.13)*SUNI*max(uSun.y,0.0)*0.45/PI; }
    else{
      /* sun disc */
      float disc=smoothstep(0.999980,0.999988,mu);
      col+=tr*vec3(1.0,0.92,0.78)*disc*60.0*uDisc;
      /* stars + faint galactic band, visible only when the sky is dark */
      float lum=dot(col,vec3(0.3,0.59,0.11));
      float vis=pow(clamp(1.0-lum*5.0,0.0,1.0),3.0);
      if(vis>0.001){
        float s=starLayer(rd,90.0,0.968)+starLayer(rd,210.0,0.985)*0.8+starLayer(rd,460.0,0.992)*0.7;
        vec3 ax=normalize(vec3(0.35,0.78,0.52));
        float band=exp(-pow(dot(rd,ax)/0.16,2.0));
        float cl=vn(rd*7.0)*0.6+vn(rd*19.0)*0.4;
        vec3 mw=vec3(0.55,0.6,0.8)*band*(0.012+0.05*cl*cl);
        vec3 sc=mix(vec3(0.75,0.85,1.0),vec3(1.0,0.88,0.7),hash13(floor(rd*90.0)));
        col+=vis*(sc*s*1.4+mw)*smoothstep(-0.02,0.04,rd.y);
      }
    }
    col=min(col,vec3(uMaxL));
    col+=(hash12(gl_FragCoord.xy)-0.5)*0.004;
    gl_FragColor=vec4(max(col,0.0),1.0);
    #include <tonemapping_fragment>
    #include <encodings_fragment>
  }`
});

const LAND_C=new V3(820,0,-215);

const normTex=(function(){
  const N=512,H=new Float32Array(N*N);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const u=x/N,v=y/N;
    H[y*N+x]=NZ.fbm(u,v,8,5)*1.0+0.45*NZ.fbm(u+0.31,v+0.17,32,3);
  }
  const c=mkCanvas(N,N),g=c.getContext('2d'),im=g.createImageData(N,N),S=9.0;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const xl=H[y*N+(x-1+N)%N],xr=H[y*N+(x+1)%N],yu=H[((y-1+N)%N)*N+x],yd=H[((y+1)%N)*N+x];
    let nx=(xl-xr)*S,nz=(yu-yd)*S,ny=1.0;
    const l=Math.hypot(nx,ny,nz);nx/=l;nz/=l;
    const i=(y*N+x)*4;im.data[i]=Math.round((nx*0.5+0.5)*255);im.data[i+1]=Math.round((nz*0.5+0.5)*255);im.data[i+2]=128;im.data[i+3]=255;

const oceanUniforms={uNorm:{value:normTex},uSun:{value:SUN.clone()},uCamH:{value:50},uTime:{value:0},uCam:{value:new V3()},uSunCol:{value:new THREE.Color(1,0.93,0.82)}};
const oceanMat=new THREE.ShaderMaterial({
  uniforms:oceanUniforms,fog:false,
  vertexShader:`varying vec3 vW;
  void main(){vec4 w=modelMatrix*vec4(position,1.0);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
  fragmentShader:ATM_COMMON+atmosFn('atmosRefl',6,3)+atmosFn('atmosAP',6,2)+`
  uniform sampler2D uNorm; uniform vec3 uSun; uniform float uCamH; uniform float uTime; uniform vec3 uCam; uniform vec3 uSunCol;
  varying vec3 vW;
  vec3 wn(vec2 uv){vec2 s=texture2D(uNorm,uv).rg*2.0-1.0;return vec3(s.x,0.0,s.y);}
  void main(){
    vec3 V=uCam-vW; float dist=length(V); V/=dist;
    float tm=uTime;
    vec2 p=vW.xz;
    vec3 n1=wn(p/61.0+vec2(tm*0.006,tm*0.004));
    vec3 n2=wn(p/17.0+vec2(-tm*0.013,tm*0.009)+0.37);
    vec3 n3=wn(p/3.7+vec2(tm*0.03,-tm*0.021)+0.71);
    float fadeA=exp(-dist/2600.0), fadeB=exp(-dist/700.0), fadeC=exp(-dist/180.0);
    vec3 nn=n1*0.55*fadeA+n2*0.8*fadeB+n3*0.9*fadeC;
    /* long swell */
    nn.x+=0.032*sin(p.x*0.021+tm*0.6+sin(p.y*0.013))*fadeA;
    nn.z+=0.028*sin(p.y*0.026-tm*0.5+sin(p.x*0.017))*fadeA;
    vec3 N=normalize(vec3(0.0,1.0,0.0)+nn);
    vec3 R=reflect(-V,N);
    R.y=abs(R.y)+0.004; R=normalize(R);
    float cosT=clamp(dot(N,V),0.0,1.0);
    float F=0.02+0.98*pow(1.0-cosT,5.0);
    F=mix(F,min(F+0.08,1.0),smoothstep(0.0,3000.0,dist));
    float h0=max(uCamH,2.0);
    vec3 trr; vec3 refl=atmosRefl(0.5+0.0*h0,R,1e9,uSun,trr);
    /* water body */
    vec3 body=vec3(0.006,0.035,0.055)+vec3(0.0,0.03,0.035)*pow(1.0-cosT,2.0)*0.4;
    float sd=max(uSun.y,0.0);
    body*=0.4+0.9*sd;
    vec3 col=mix(body,refl,F);
    /* sun glitter */
    float mu=max(dot(R,uSun),0.0);
    float sg=clamp(0.011+dist*1.3e-6,0.011,0.14);
    float lobe=exp(-(1.0-mu)/(sg*sg))*pow(0.011/sg,1.7);
    float sunSpec=lobe*1.1+pow(mu,420.0)*2.2*fadeB+pow(mu,36.0)*0.05*exp(-dist/20000.0);
    col+=uSunCol*sunSpec*F*7.0*smoothstep(0.0,0.05,R.y);

    vec3 trA; vec3 ins=atmosAP(h0,-V,dist,uSun,trA);
    vec3 rdv=-V;
    col=col*trA+ins;
    col+=(hash12(gl_FragCoord.xy)-0.5)*0.003;
    gl_FragColor=vec4(max(col,0.0),1.0);
    #include <tonemapping_fragment>
    #include <encodings_fragment>
  }`
});

function tileConcrete(S,seed,tint){
  const c=mkCanvas(S,S),g=c.getContext('2d'),im=g.createImageData(S,S),r=mulberry32(seed||7);
  tint=tint||[1,1,1];
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const u=x/S,v=y/S;
    const n=NZ.fbm(u,v,8,5),f=NZ.fbm(u+0.2,v+0.6,64,2),st=NZ.fbm(u+0.5,v+0.1,4,3);
    let l=0.42+0.26*(n-0.5)+0.12*(f-0.5)+(r()-0.5)*0.07;
    l*=1-0.28*Math.pow(clamp((st-0.52)*4,0,1),1.2);
    const i=(y*S+x)*4;
    im.data[i]=clamp(l*255*tint[0],0,255);im.data[i+1]=clamp(l*252*tint[1],0,255);im.data[i+2]=clamp(l*246*tint[2],0,255);im.data[i+3]=255;
  }
  g.putImageData(im,0,0);
  /* hairline cracks */
  g.strokeStyle='rgba(30,28,26,.35)';g.lineWidth=1;
  for(let k=0;k<7;k++){
    let x=r()*S,y=r()*S,a=r()*6.28;g.beginPath();g.moveTo(x,y);
    for(let s=0;s<22;s++){a+=(r()-0.5)*0.9;x+=Math.cos(a)*S*0.012;y+=Math.sin(a)*S*0.012;g.lineTo(x,y);}
    g.stroke();
  }
  return c;
}
function toTex(c,rx,ry,srgb){
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx||1,ry||1);t.anisotropy=maxAniso;
  if(srgb!==false)t.encoding=THREE.sRGBEncoding;
  return t;
}
const concreteC=tileConcrete(512,11);

function padTexture(){
  const S=1024,c=mkCanvas(S,S),g=c.getContext('2d'),R=S/2,pat=g.createPattern(concreteC,'repeat');
  g.fillStyle=pat;g.fillRect(0,0,S,S);
  g.save();g.beginPath();g.arc(R,R,R-1,0,6.2832);g.clip();
  /* expansion joints */
  g.strokeStyle='rgba(25,24,22,.55)';g.lineWidth=2;
  for(let i=0;i<=S;i+=S/12){g.beginPath();g.moveTo(i,0);g.lineTo(i,S);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(S,i);g.stroke();}
  /* exhaust scorch from earlier landings */
  let gr=g.createRadialGradient(R,R,0,R,R,R*0.42);
  gr.addColorStop(0,'rgba(18,16,14,.72)');gr.addColorStop(0.5,'rgba(25,22,20,.38)');gr.addColorStop(1,'rgba(30,26,22,0)');
  g.fillStyle=gr;g.fillRect(0,0,S,S);
  const rr=mulberry32(99);
  for(let i=0;i<70;i++){
    const a=rr()*6.283,r0=R*(0.05+rr()*0.2),r1=r0+R*(0.15+rr()*0.35);
    g.strokeStyle='rgba(20,18,16,'+(0.05+rr()*0.1)+')';g.lineWidth=2+rr()*6;
    g.beginPath();g.moveTo(R+Math.cos(a)*r0,R+Math.sin(a)*r0);g.lineTo(R+Math.cos(a)*r1,R+Math.sin(a)*r1);g.stroke();
  }
  /* paint */
  const ring=(r0,r1,col)=>{g.strokeStyle=col;g.lineWidth=(r1-r0)*R;g.beginPath();g.arc(R,R,(r0+r1)/2*R,0,6.2832);g.stroke();};
  ring(0.895,0.965,'#f1f1ea');
  ring(0.55,0.585,'#f1f1ea');
  ring(0.30,0.335,'#f1f1ea');
  ring(0.135,0.20,'#f2f0e6');
  ring(0.20,0.235,'#e8661a');
  /* hazard dashes between outer ring and pad edge */
  for(let i=0;i<72;i++){
    const a=i/72*6.2832;g.save();g.translate(R,R);g.rotate(a);
    g.fillStyle=i%2?'#e8c21a':'#1c1c1c';g.fillRect(R*0.972,-R*0.015,R*0.022,R*0.03);g.restore();
  }
  /* spokes */
  g.strokeStyle='#efefe6';g.lineWidth=5;
  for(let i=0;i<8;i++){const a=i*Math.PI/4;g.beginPath();g.moveTo(R+Math.cos(a)*R*0.235,R+Math.sin(a)*R*0.235);g.lineTo(R+Math.cos(a)*R*0.895,R+Math.sin(a)*R*0.895);g.stroke();}
  /* centre target */
  g.fillStyle='#e8661a';g.beginPath();g.arc(R,R,R*0.045,0,6.2832);g.fill();
  g.strokeStyle='#f2f0e6';g.lineWidth=7;
  g.beginPath();g.moveTo(R-R*0.13,R);g.lineTo(R+R*0.13,R);g.moveTo(R,R-R*0.13);g.lineTo(R,R+R*0.13);g.stroke();
  /* pad name */
  g.fillStyle='#f1f1ea';g.font='bold '+Math.round(R*0.1)+'px Arial, Helvetica, sans-serif';g.textAlign='center';g.textBaseline='middle';
  for(let i=0;i<4;i++){g.save();g.translate(R,R);g.rotate(i*Math.PI/2+Math.PI/4);g.translate(0,-R*0.72);g.fillText('LZ-1',0,0);g.restore();}
  /* weathering over everything */
  g.globalAlpha=0.38;g.fillStyle=pat;g.fillRect(0,0,S,S);g.globalAlpha=1;
  g.restore();
  const t=new THREE.CanvasTexture(c);t.anisotropy=maxAniso;t.encoding=THREE.sRGBEncoding;
  return t;
}

/* ================= land ================= */
const PADS=[LAUNCH,LZ];
function coastR(th){return 2350+170*Math.sin(3*th+1)+110*Math.sin(5*th+2)+60*Math.sin(9*th);}
function landH(x,z){
  const dx=x-LAND_C.x,dz=z-LAND_C.z,r=Math.hypot(dx,dz),th=Math.atan2(dz,dx);
  const mask=1-sstep(coastR(th)-220,coastR(th)+180,r);
  let dp=1e9;for(let i=0;i<2;i++)dp=Math.min(dp,Math.hypot(x-PADS[i].x,z-PADS[i].z));
  const flat=sstep(180,520,dp);
  const bump=(NZ.fbm((x+9000)/1900,(z+9000)/1900,6,4)-0.45)*3.2*flat+(NZ.fbm((x+7000)/230,(z+3000)/230,16,3)-0.5)*0.9*flat;
  const inland=Math.max(bump,-0.3*flat);
  return lerp(-8,inland,sstep(0,0.9,mask));
}
const land=(function(){
  const SZ=6800,SEG=220;

float n2(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(h2(i),h2(i+vec2(1,0)),f.x),mix(h2(i+vec2(0,1)),h2(i+vec2(1,1)),f.x),f.y);}

            t+R()*STEP,0.8+R()*0.8,0.3,2.4+R()*1.2,0.55,0.0,0.97,0.98,1.0,0.0,2.4,R());
        }
      }
    }
  }
  /* ---- re-entry embers (additive) ---- */
  if(S.heat>0.08){
    let n=Math.floor(S.heat*6+R());
    while(n-->0){
      const a=R()*6.2832,rr=Math.sqrt(R())*1.6;
      _v2.set(Math.cos(a)*rr,1.0+R()*7,Math.sin(a)*rr).applyQuaternion(_qq).add(_pp);
      PE.emit(_v2.x,_v2.y,_v2.z,S.vel.x*0.96+(R()-0.5)*5,S.vel.y*0.96+(R()-0.5)*5,S.vel.z*0.96+(R()-0.5)*5,t+R()*STEP,0.7+R()*1.0,0.45,0.12,0.9,-1.5,1.0,0.55+0.3*R(),0.2,1.0,1.7,R());
    }
  }
}
const WIN=15;
let psNext=0,psLast=-1;
function psAdvance(t){
  if(t<psLast-1e-6||t-psLast>0.6||psLast<0){
    PS.clear();PE.clear();
    psNext=Math.max(0,Math.floor((t-WIN)/STEP));
  }
  const kEnd=Math.floor(t/STEP);
  while(psNext<=kEnd){spawnStep(psNext);psNext++;}
  psLast=t;
}
const _sv=new V3();
FRAME.push(function(S,dt,tr){
  psAdvance(S.t);
  PSU.uTime.value=S.t;
  _sv.copy(SUN).transformDirection(camera.matrixWorldInverse);
  PSU.uSunV.value.copy(_sv);
  PS.flush();PE.flush();
});

/* ================= cameras ================= */
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.08;controls.minDistance=6;controls.maxDistance=600;controls.rotateSpeed=0.7;controls.zoomSpeed=0.8;
controls.maxPolarAngle=Math.PI*0.52;
const CAMS=[null,'ROCKET ORBIT','CHASE CAM','LAUNCH TOWER','ONBOARD SKIRT CAM','LANDING PAD CAM','MISSION OVERVIEW'];
let camMode=0,camSnap=true;
const LZ_CAM=new V3(LZ.x-110,2.2,LZ.z+120);
const OV_MID=new V3((LAUNCH.x+LZ.x)/2,0,(LAUNCH.z+LZ.z)/2);
const OV_POS=new V3();
const camLook=new V3(),camLookS=new V3(),camPosS=new V3(),camCen=new V3(),prevCen=new V3(),tmpA=new V3(),tmpB=new V3(),tmpC=new V3(),vHat=new V3();
let fovS=50;
const obEl=document.getElementById('ob'),labEl=document.getElementById('camlabel');
const retic=document.createElement('div');
retic.style.cssText='position:fixed;width:46px;height:46px;margin:-23px 0 0 -23px;border:1px solid rgba(127,227,255,.85);pointer-events:none;display:none;z-index:3;box-shadow:0 0 12px rgba(127,227,255,.3)';
retic.innerHTML='<span style="position:absolute;left:52px;top:-2px;font:10px ui-monospace,Consolas,monospace;color:#7fe3ff;white-space:nowrap;letter-spacing:.08em"></span>';
document.body.appendChild(retic);
const reticLab=retic.firstChild;
function setCam(n){
  camMode=n;camSnap=true;
  document.querySelectorAll('#cams button').forEach(b=>b.classList.toggle('on',+b.dataset.cam===n));
  labEl.textContent='CAM '+n+' · '+CAMS[n];
  obEl.style.display=n===4?'block':'none';
  controls.enabled=n===1;
  if(n===1){
    camera.fov=46;camera.updateProjectionMatrix();
    camCen.set(ST.pos.x,ST.pos.y+COM_H,ST.pos.z);
    const off=new V3(46,14,70);
    camera.position.copy(camCen).add(off.applyAxisAngle(_up,SIDE.x*0));
    controls.target.copy(camCen);prevCen.copy(camCen);
  }
}
const _ml=new THREE.Matrix4();
function followLook(look,posTarget,dt,tauP,tauL){
  const aP=camSnap?1:1-Math.exp(-dt/tauP),aL=camSnap?1:1-Math.exp(-dt/tauL);
  camPosS.lerp(posTarget,aP);camLookS.lerp(look,aL);
  camera.position.copy(camPosS);camera.lookAt(camLookS);
}
function updateCamera(S,dt,tr){
  camCen.set(S.pos.x,S.pos.y+COM_H*Math.cos(S.tilt*DEG),S.pos.z);
  let fov=50,showRet=false;
  if(camMode===1){
    tmpA.subVectors(camCen,prevCen);
    if(tmpA.lengthSq()<1e10){camera.position.add(tmpA);}
    controls.target.copy(window.__camTarget||camCen);prevCen.copy(camCen);
    controls.update();
    if(camera.position.y<2)camera.position.y=2;
    fov=46;camSnap=false;
    camera.up.set(0,1,0);
  }
  else if(camMode===2){
    vHat.copy(S.vel);vHat.y+=3;vHat.normalize();
    const back=tmpA.copy(vHat).multiplyScalar(-1);
    const dist=52+Math.min(S.speed,500)*0.02;
    tmpB.copy(camCen).addScaledVector(back,dist).addScaledVector(SIDE,17).add(tmpC.set(0,9,0));
    if(S.alt<80)tmpB.y=Math.max(tmpB.y,5+Math.max(0,S.alt*0.0));
    if(tmpB.y<4)tmpB.y=4;
    if(camSnap){camPosS.copy(tmpB);camLookS.copy(camCen);}
    if(camPosS.distanceTo(tmpB)>400){camPosS.copy(tmpB);}
    tmpC.copy(camCen).addScaledVector(vHat,5);
    followLook(tmpC,tmpB,dt,0.55,0.16);
    if(camera.position.y<3)camera.position.y=3;
    camera.lookAt(camLookS);
    fov=lerp(52,60,clamp(S.speed/500,0,1));camSnap=false;
  }
  else if(camMode===3){
    camera.position.copy(TOWER_CAM);
    tmpA.copy(camCen);
    if(camSnap)camLookS.copy(tmpA);
    camLookS.lerp(tmpA,camSnap?1:1-Math.exp(-dt/0.05));
    camera.lookAt(camLookS);
    const dist=camera.position.distanceTo(camLookS);
    fov=clamp(2*Math.atan(34/dist)/DEG,0.7,52);
    showRet=true;camSnap=false;
  }
  else if(camMode===4){
    tmpA.set(2.5,40.7,0);tmpB.set(0.6,2.8,0);
    rocket.updateMatrixWorld(true);
    const wp=rocket.localToWorld(tmpA.clone()),wt=rocket.localToWorld(tmpB.clone());
    const shake=0.018*S.thr+0.004;
    wp.x+=(Math.sin(tr*61)+Math.sin(tr*37.3))*shake;wp.y+=Math.sin(tr*53.1)*shake;wp.z+=Math.sin(tr*47.7)*shake;
    camera.position.copy(wp);
    camera.up.copy(tmpC.set(0,0,1).transformDirection(rocket.matrixWorld));
    camera.lookAt(wt);
    fov=78;camSnap=false;
  }
  else if(camMode===5){
    camera.position.copy(LZ_CAM);
    if(camSnap)camLookS.copy(camCen);
    camLookS.lerp(camCen,camSnap?1:1-Math.exp(-dt/0.06));
    camera.lookAt(camLookS);
    const dist=camera.position.distanceTo(camLookS);
    fov=clamp(2*Math.atan(34/dist)/DEG,0.9,40);
    showRet=true;camSnap=false;
  }
  else if(camMode===6){
    const k=sstep(0,9000,S.alt);
    OV_POS.copy(OV_MID).addScaledVector(SIDE,lerp(4600,12000,k));OV_POS.y=lerp(240,600,k);
    camera.position.copy(OV_POS);
    const ht=Math.max(140,S.alt*0.30+110);
    tmpA.set(OV_MID.x+(camCen.x-OV_MID.x)*0.12,ht,OV_MID.z+(camCen.z-OV_MID.z)*0.12);
    if(camSnap)camLookS.copy(tmpA);
    camLookS.lerp(tmpA,camSnap?1:1-Math.exp(-dt/0.5));
    camera.lookAt(camLookS);
    fov=72;showRet=true;camSnap=false;
  }
  if(camMode!==4&&camMode!==1)camera.up.set(0,1,0);
  if(Math.abs(fov-camera.fov)>0.001){camera.fov=camMode===3||camMode===5?lerp(camera.fov,fov,camSnap?1:1-Math.exp(-dt/0.08)):fov;camera.updateProjectionMatrix();}
  { const nn=camMode===4?0.5:lerp(0.5,4,sstep(400,4000,camera.position.y));
    if(Math.abs(nn-camera.near)>0.05){camera.near=nn;camera.updateProjectionMatrix();} }
  /* reticle for long-lens views */
  if(showRet){
    tmpB.copy(camCen).project(camera);
    const vis=tmpB.z<1&&Math.abs(tmpB.x)<1.05&&Math.abs(tmpB.y)<1.05;
    const sx=(tmpB.x*0.5+0.5)*window.innerWidth,sy=(-tmpB.y*0.5+0.5)*window.innerHeight;
    const dist=camera.position.distanceTo(camCen);
    const px=41/Math.max(dist,1)*window.innerHeight/(2*Math.tan(camera.fov*DEG/2));
    if(vis&&px<40){
      retic.style.display='block';retic.style.transform='translate('+sx.toFixed(1)+'px,'+sy.toFixed(1)+'px)';
      reticLab.textContent='ALT '+(S.alt>=1000?(S.alt/1000).toFixed(2)+' km':S.alt.toFixed(0)+' m')+'  M'+S.mach.toFixed(2);
    }else retic.style.display='none';
  }else retic.style.display='none';
}

/* ================= shadows follow the vehicle ================= */
const _ls=new V3(),_lr=new V3(),_lu=new V3();
function updateShadow(S){
  const f=_ls.set(S.pos.x,S.pos.y+COM_H*0.5,S.pos.z);
  const lz=SUN.clone().normalize();
  _lr.crossVectors(new V3(0,1,0),lz).normalize();_lu.crossVectors(lz,_lr).normalize();
  const tx=2*SH/2048;
  const a=Math.round(f.dot(_lr)/tx)*tx,b=Math.round(f.dot(_lu)/tx)*tx,c=f.dot(lz);
  const sn=new V3().set(0,0,0).addScaledVector(_lr,a).addScaledVector(_lu,b).addScaledVector(lz,c);
  sunLight.target.position.copy(sn);
  sunLight.position.copy(sn).addScaledVector(lz,330);
  const far=S.alt<430?330+S.alt/Math.max(SUN.y,0.2)+150:520;
  if(Math.abs(sunLight.shadow.camera.far-far)>2){sunLight.shadow.camera.far=far;sunLight.shadow.camera.updateProjectionMatrix();}
  sunLight.target.updateMatrixWorld();
  /* sunlight thins out with altitude only slightly; keep a clean value */
  sunLight.intensity=2.5;
}

/* ================= HUD / UI ================= */
const $=id=>document.getElementById(id);
const el={alt:$('alt'),altu:$('altu'),vv:$('vv'),vh:$('vh'),mach:$('mach'),pitch:$('pitch'),tilt:$('tilt'),q:$('q'),thr:$('thr'),thrb:$('thrb'),prop:$('prop'),propb:$('propb'),phase:$('phase'),clock:$('clock'),tnow:$('tnow'),scrub:$('scrub'),pills:$('pills'),ticks:$('ticks'),pp:$('pp')};
PHASES.forEach((p,i)=>{const e=document.createElement('em');e.textContent=p.s;e.dataset.i=i;el.pills.appendChild(e);const k=document.createElement('i');k.textContent=({'LAND BURN':'BURN','TOUCHDOWN':'TD'})[p.s]||p.s;k.style.left=(p.t/T_END*100)+'%';el.ticks.appendChild(k);});
const pillEls=[...el.pills.children];
const propMax=(function(){const s=FL.state(0,FL.mk());return s.prop;})();
let lastPhase=-1;
function updateHUD(S){
  const a=S.alt;
  if(a>=1000){el.alt.textContent=(a/1000).toFixed(2);el.altu.textContent='km';}else{el.alt.textContent=a.toFixed(a<10?1:0);el.altu.textContent='m';}
  el.vv.textContent=(S.vv>=0?'+':'')+S.vv.toFixed(1);
  el.vh.textContent=S.vh.toFixed(1);
  el.mach.textContent=S.mach.toFixed(2);
  el.pitch.textContent=(90-S.tilt).toFixed(1);
  el.tilt.textContent=Math.abs(S.tilt).toFixed(1);
  el.q.textContent=(S.q/1000).toFixed(1);
  const th=S.nAct>0?S.thr*100:0;
  el.thr.textContent=Math.round(th);el.thrb.style.width=th.toFixed(1)+'%';
  el.prop.textContent=Math.round(S.prop/10)*10;el.propb.style.width=(S.prop/propMax*100).toFixed(1)+'%';
  el.clock.textContent='T+'+S.t.toFixed(1).padStart(4,'0');
  el.tnow.textContent='T+'+S.t.toFixed(2).padStart(5,'0')+' / '+T_END.toFixed(2);
  if(S.phase!==lastPhase){
    lastPhase=S.phase;el.phase.textContent=PHASES[S.phase].n;
    pillEls.forEach((e,i)=>{e.className=i===S.phase?'on':(i<S.phase?'done':'');});
  }

/* playback state */
let simT=0,playing=true,speed=1,scrubbing=false,wasPlaying=true,realT=0;
function setPlaying(p){playing=p;el.pp.innerHTML=p?'&#10074;&#10074;':'&#9654;';}
function seek(t){simT=clamp(t,0,T_END);}
document.querySelectorAll('#cams button').forEach(b=>b.addEventListener('click',()=>setCam(+b.dataset.cam)));
document.querySelectorAll('#spd button').forEach(b=>b.addEventListener('click',()=>{speed=+b.dataset.s;document.querySelectorAll('#spd button').forEach(x=>x.classList.toggle('on',x===b));}));
el.pp.addEventListener('click',()=>{if(simT>=T_END-0.01){seek(0);}setPlaying(!playing);});
el.scrub.addEventListener('pointerdown',()=>{scrubbing=true;wasPlaying=playing;});
window.addEventListener('pointerup',()=>{if(scrubbing){scrubbing=false;}});
el.scrub.addEventListener('input',()=>{seek(parseFloat(el.scrub.value));camSnap=camMode!==1&&camMode!==2?camSnap:camSnap;});
window.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT'&&e.code==='Space')e.target.blur();
  if(e.code==='Space'){e.preventDefault();if(simT>=T_END-0.01)seek(0);setPlaying(!playing);}
  else if(e.key>='1'&&e.key<='6')setCam(+e.key);
  else if(e.code==='ArrowRight'){seek(simT+2);}
  else if(e.code==='ArrowLeft'){seek(simT-2);}
  else if(e.key==='r'||e.key==='R'){seek(0);setPlaying(true);}
  else if(e.key==='h'||e.key==='H'){const v=$('hud').style.display==='none'?'':'none';$('hud').style.display=v;$('hint').style.display=v;}
});
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

/* ================= main loop ================= */
let lastNow=performance.now(),prevSimT=-1,emaDt=1/60,frameCount=0,pr=Math.min(window.devicePixelRatio||1,1.75);const PR_MAX=pr;
FL.state(0,ST);updateRocket(ST,0);
setCam(1);
function drawFrame(dt){
  FL.state(simT,ST);
  if(Math.abs(simT-prevSimT)>0.8&&camMode!==1)camSnap=true;
  prevSimT=simT;
  if(!scrubbing)el.scrub.value=simT;
  updateRocket(ST,simT);
  updatePlume(ST,simT,realT);
  updateCamera(ST,dt,realT);
  camera.updateMatrixWorld();camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
  updateShadow(ST);
  for(let i=0;i<FRAME.length;i++)FRAME[i](ST,dt,realT);
  updateHUD(ST);
  renderer.render(scene,camera);
}
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.1,(now-lastNow)/1000);lastNow=now;
  if(window.__manual)return;
  emaDt=emaDt*0.95+dt*0.05;
  if(++frameCount%45===0){
    if(emaDt>0.0215&&pr>0.6){pr=Math.max(0.6,pr-0.15);renderer.setPixelRatio(pr);renderer.setSize(window.innerWidth,window.innerHeight);}
    else if(emaDt<0.0135&&pr<PR_MAX){pr=Math.min(PR_MAX,pr+0.1);renderer.setPixelRatio(pr);renderer.setSize(window.innerWidth,window.innerHeight);}
  }
  realT+=dt;
  if(playing&&!scrubbing){
    simT+=dt*speed;
    if(simT>=T_END){simT=T_END;setPlaying(false);}
  }
  drawFrame(dt);
}
window.__sim={dbg:{cloudMesh:cloudMesh,sky:sky,ocean:ocean,land:land,PS:PS,PE:PE,rocket:rocket,PLUMES:PLUMES,sunLight:sunLight,engLight:engLight,padGlow:padGlow,scene:scene,PU:PU,MAT:MAT},draw:function(dt){realT+=dt;drawFrame(dt);},seek:seek,setCam:setCam,setPlaying:setPlaying,ST:ST,scene:scene,renderer:renderer,camera:camera,FL:FL,get t(){return simT;}};
requestAnimationFrame(frame);
}  /* end start() */
