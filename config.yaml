# Every vehicle/environment number below is APPROXIMATE, educational and generic.
# These are NOT official Falcon 9 specifications. SI units; z is up; quaternion wxyz.
vehicle:
  dry_mass: 22000.0 # approximate kg
  fuel_mass: 16000.0 # approximate landing/ascent reserve kg, not full orbital propellant
  isp: 300.0 # approximate seconds
  max_thrust: 760000.0 # approximate N, one generic engine
  min_throttle: 0.35 # approximate engine-on floor; engine can switch fully off
  throttle_rate: 2.0 # approximate fraction of max thrust per second while spooling up or throttling
  shutdown_rate: 5.0 # approximate fraction of max thrust per second during engine cutoff
  gimbal_limit_deg: 8.0 # approximate degrees
  gimbal_rate_deg_s: 30.0 # approximate degrees/s
  length: 40.0 # approximate m
  engine_lever: 17.9 # m from booster center to rendered gimbal pivot
  landing_foot_radius: 6.2 # m; four deployed feet, matches rendered gear
  contact_model: feet # first tilted sole contact; impact state is retained
  hold_down_release_margin: 1.05 # vertical thrust/weight before support release
  hold_down_release_time: 0.2 # seconds of sustained positive launch margin
  radius: 1.8 # approximate m
  inertia: [5100000.0, 5100000.0, 61000.0] # approximate kg m2 at dry mass, scaled with mass
  drag_coefficient: 0.5 # approximate
  area: 10.18 # approximate m2, isotropic lumped drag (no lift/grid-fin aerodynamics)
world:
  gravity: 9.80665 # approximate constant; also g0 in Isp conversion
  density_sea_level: 1.225 # approximate kg/m3
  scale_height: 8500.0 # approximate m
  wind_mean: [2.0, -1.0, 0.0] # approximate m/s
  gust_std: 0.8 # approximate m/s, mean-reverting process
  sensor_noise: 0.005 # approximate relative to observation scale
  position_noise_m: 0.12 # generic precision-navigation position standard deviation
  velocity_noise_m_s: 0.04 # generic velocity standard deviation; not vendor sensor data
  timestep: 0.02 # approximate integration seconds
  control_substeps: 5 # approximate 10 Hz control; 50 Hz integration
mission:
  landing_altitude: [180.0, 240.0] # approximate descent-start altitude range, m AGL
  landing_vertical_velocity: [-24.0, -16.0] # approximate m/s
  horizontal_position: 12.0 # approximate +/- m
  horizontal_velocity: 1.5 # approximate +/- m/s
  initial_tilt_deg: 2.0 # approximate
  pad: [0.0, 0.0, 0.0] # approximate static pad, ship appearance is visual only
  launch_stand_height: 3.0 # approximate m; booster rests on this stand, altitude is measured from its top
  touchdown_speed: 2.0 # approximate strict total speed threshold m/s
  touchdown_tilt_deg: 5.0 # approximate strict tilt threshold
  pad_radius: 5.0 # approximate m
  landing_tolerance: 1.0 # maximum center-coordinate error at first contact, m
  separation_shutdown: true # command cutoff, finish valve ramp, then release stage
  takeoff_altitude: 400.0 # approximate separation, NOT orbit
  takeoff_velocity: 25.0 # approximate m/s
  takeoff_velocity_tolerance: 8.0 # approximate m/s
  timeout: 90.0 # approximate seconds
  bounds: 2500.0 # approximate m
reward:
  profile: state-potential-v3 # dense state-only shaping; no expert controls or target actions
  potential_height: 0.25 # potential uses meters of remaining mission distance
  potential_speed: 6.0 # potential penalizes kinetic state, never a controller-generated action
  potential_tilt: 80.0 # 1-cos(tilt) keeps attitude stable and bounded
  potential_rate: 3.0 # rad/s norm, favors stable rotation
  potential_lateral: 2.0 # meters from the static pad/launch line
  action_cost: 0.01 # gimbal effort; throttle fuel already has a separate cost
  progress: 0.15 # Potential difference toward target, limited to avoid rewarding dives
  velocity: 0.08 # Penalize speed near landing / ascent target speed error
  tilt: 2.0 # Penalize radians squared; encourage upright flight
  angular_velocity: 0.2 # Penalize body rates
  position: 0.01 # Lateral error cost, meters
  fuel: 0.001 # kg burned; modest efficiency incentive
  alive: 0.05 # Cost per second to prevent indefinite hovering
  success: 200.0 # Terminal mission completion
  failure: -100.0 # Terminal mission failure
  terminal_speed: 2.0 # Smooth terminal speed-error cost, makes near misses informative
  terminal_tilt: 0.2 # Terminal tilt cost, radians squared
  terminal_position: 1.0 # Terminal lateral error cost, meters
training:
  seed: 42
  n_envs: 4
  checkpoints: [10000, 100000, 500000, 1000000, 5000000, 10000000]
  evaluation_episodes: 10000
  curriculum_threshold: 0.75
  curriculum_window: 40
  initial_difficulty: 0.0
  curriculum_increment: 0.025 # small distribution changes avoid a 3 m -> 35 m jump
  observation_normalization: false # fixed physical scaling is stable across curriculum transitions
  observation_position_scale: [40.0, 40.0, 250.0]
  observation_velocity_scale: [10.0, 10.0, 30.0]
  reward_normalization: true
  policy_log_std: -2.3 # exploration remains a learned stochastic policy
  learning_rate: 0.0003
  retarget_probability: 0.35 # training-only mid-flight landing-target changes
  retarget_max_offset: 70.0 # approximate m, sampled divert distance
  retarget_min_altitude: 45.0 # approximate m AGL, keeps the divert solvable
